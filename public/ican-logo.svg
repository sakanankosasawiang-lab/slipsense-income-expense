<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <!-- Background & Icon Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1d4ed8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM ICON (Squircle with 3D Depth & Growth Bars) -->
  <g transform="translate(10, 10)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#shieldGrad)" filter="url(#glowFilter)" />
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="1.5" y="1.5" width="97" height="97" rx="24.5" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Growth Chart Bars & Dynamic Trend Arrow -->
    <rect x="22" y="56" width="11" height="24" rx="4" fill="#38bdf8" fill-opacity="0.6" />
    <rect x="39" y="44" width="11" height="36" rx="4" fill="#60a5fa" fill-opacity="0.8" />
    <rect x="56" y="30" width="11" height="50" rx="4" fill="url(#chartGrad)" />

    <!-- Swooping Dynamic Check/Trend Arrow (Symbol of 'I CAN') -->
    <path d="M 24 52 Q 46 44 68 24 L 78 30 L 76 16 L 62 18 L 70 24 Z" fill="#ffffff" />
    
    <!-- Sparkling Energy Dot (The 'i' dot) -->
    <circle cx="76" cy="18" r="4.5" fill="#38bdf8" />
    <circle cx="76" cy="18" r="2.2" fill="#ffffff" />
  </g>

  <!-- TYPOGRAPHY: iCAN Income Expense App -->
  <g transform="translate(126, 26)">
    <!-- 'i' in Cyan/Vibrant Blue -->
    <text x="0" y="46" font-family="'Prompt', -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" font-weight="700" fill="#2563eb">i</text>
    
    <!-- 'CAN' in Bold Navy -->
    <text x="16" y="46" font-family="'Prompt', -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">CAN</text>
    
    <!-- Subtitle Badge / Pill -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="230" height="24" rx="6" fill="#eff6ff" />
      <text x="10" y="16" font-family="'Prompt', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8" letter-spacing="0.8px">INCOME EXPENSE APP</text>
    </g>
  </g>
</svg>
